name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}   # allow re-running the algorithm/commitment/JS locks on demand

# Least privilege: this workflow runs PR-controllable code (pytest/pyflakes over
# fork PRs) and needs no write access -- read-only token, nothing to push.
permissions:
  contents: read

jobs:
  # Locks the frozen draw algorithm + commitment chain (SPEC.md), the publish
  # path (scripts/extend_pages.py, via test_publish_smoke), and the in-browser JS
  # (verify.js / stats.js / trend.js) run under Node -- pinned via setup-node so
  # the JS<->Python parity tests can't silently skip. Runtime is stdlib-only, so
  # pytest is the only dependency.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"
      - name: Install pytest (runtime is stdlib-only) + confirm Node is present
        run: |
          pip install pytest==9.0.3 pyflakes==3.4.0
          node --version   # parity tests @skipUnless(node) -- fail loudly here if it's ever missing
      - name: Lint (pyflakes -- unused imports / undefined names; no style noise)
        run: pyflakes verify.py randomness.py scripts/ tests/
      - name: Run the test suite
        run: pytest -ra
