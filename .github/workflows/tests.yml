name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Locks the frozen draw algorithm + commitment chain (SPEC.md) and the
  # in-browser verifiers (static/verify.js, static/stats.js), which run under
  # the runner's preinstalled Node. Runtime is stdlib-only, so the whole suite
  # needs nothing but pytest -- a red here means the algorithm, its golden
  # vectors, the commitment formula, or a JS verifier changed.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pytest only (runtime is stdlib-only)
        run: pip install pytest==9.0.3
      - name: Run the test suite
        run: pytest -ra
