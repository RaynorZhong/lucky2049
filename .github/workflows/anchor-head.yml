name: anchor-head

# Externally anchor the commitment head with OpenTimestamps: timestamp the
# current published head onto the Bitcoin blockchain (via OTS calendars) so the
# operator can't silently rewrite history. Daily + manual -- a new head appears
# ~daily as a window matures, so daily anchoring keeps the most-recent draws'
# unanchored window to ~1 day (vs ~1 week before). Commits proofs to main; the
# refresh-pages workflow then serves them at /anchors/.
on:
  schedule:
    - cron: "40 2 * * *"   # daily ~02:40 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: anchor-head
  cancel-in-progress: false

jobs:
  anchor:
    runs-on: ubuntu-latest
    steps:
      # Don't leave the push token on disk while third-party PyPI code (the OTS
      # client + its deps) runs -- this workflow can write verify.py/index.json,
      # exactly the tamper class the project exists to prevent. The final step
      # pushes with an explicit token URL instead.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"
      - name: Install the OpenTimestamps client (pinned)
        run: pip install 'opentimestamps-client>=0.7,<0.8'

      - name: Stamp the current published head (skips draws already anchored)
        run: |
          python scripts/anchor_head.py
          for f in anchors/*.head.json; do
            [ -f "$f.ots" ] || ots stamp "$f"
          done

      - name: Upgrade earlier pending proofs to full Bitcoin attestations
        run: |
          for f in anchors/*.ots; do ots upgrade "$f" || true; done
          rm -f anchors/*.ots.bak   # ots upgrade leaves .bak backups -- don't version-control them
        continue-on-error: true

      - name: Commit new / upgraded proofs to main
        run: |
          git add anchors
          if git diff --cached --quiet; then
            echo "no anchor changes"; exit 0
          fi
          git -c user.email=anchor@users.noreply.github.com \
              -c user.name="lucky2049 anchor bot" \
              commit -m "Anchor commitment head via OpenTimestamps"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
