name: refresh-pages

# Server-less "drawer + publisher": on a schedule, extend the published snapshot
# with any newly-confirmed draws straight from the chain (no DB, stdlib only),
# then republish to gh-pages. This is what keeps the GitHub Pages site fresh
# without any external host.
on:
  schedule:
    - cron: "20 * * * *"   # hourly at :20 UTC -- publish a matured window within the hour
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # main: verify.py, scripts, web/, static/
      - uses: actions/checkout@v4          # current published snapshot
        with:
          ref: gh-pages
          path: _published
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Extend snapshot from the chain (stdlib only, no DB)
        # Optional self-hosted Core source: when the BITCOIN_RPC_URL secret is set,
        # the node becomes the preferred source and one of the agreement voters
        # (CF_ACCESS_* = Cloudflare Access service token in front of it). Unset
        # secrets resolve to empty strings -> the publisher behaves exactly as
        # before, explorers only.
        env:
          BITCOIN_RPC_URL: ${{ secrets.BITCOIN_RPC_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          mkdir -p site
          cp _published/index.json site/index.json
          python scripts/extend_pages.py site/index.json
          cp web/index.html web/verify.html web/stats.html web/trend.html web/og.png site/
          cp web/CNAME site/                 # custom domain -- keep across republishes
          cp static/verify.js static/stats.js static/trend.js static/style.css static/favicon.svg site/
          cp -r anchors site/anchors 2>/dev/null || true   # serve OpenTimestamps proofs at /anchors/
          touch site/.nojekyll

      - name: Publish to gh-pages
        run: |
          # Mirror the freshly built site into the checked-out gh-pages tree.
          # status.json is a per-run health heartbeat (checked_at/latency change
          # every probe), so most hourly runs publish a small "Refresh source
          # health" commit; new draws / asset edits get "Refresh static snapshot"
          # so they stay findable. The diff gate still skips truly empty runs.
          rsync -a --delete --exclude='.git' site/ _published/
          cd _published
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          if git diff --cached --name-only | grep -qv '^status\.json$'; then
            msg="Refresh static snapshot"
          else
            msg="Refresh source health"
          fi
          git -c user.email=pages@users.noreply.github.com -c user.name="lucky2049 pages bot" \
            commit -q -m "$msg"
          git push -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Alarm on a degraded refresh (the status.json is already published)
        run: |
          python - <<'EOF'
          import json, os, sys
          st = json.load(open("site/status.json"))
          srcs = st.get("sources") or []          # empty for an offline rebuild stub -> skip
          healthy = sum(1 for s in srcs if s.get("ok"))
          need = int(os.environ.get("MIN_SOURCE_AGREEMENT") or "2")
          problems = []
          if srcs and healthy == 0:
              problems.append("ALL SOURCES DOWN")
          elif srcs and healthy < need:
              problems.append(f"only {healthy} healthy source(s) < MIN_SOURCE_AGREEMENT={need} -- drawing stalled")
          if st.get("held") is not None:
              problems.append(f"draw {st['held']} HELD -- sources disagree on a confirmed window")
          if st.get("note"):   # extend_pages sets note only on an anomaly (implausible tip / reorg mismatch)
              problems.append(st["note"])
          if problems:
              sys.exit("status.json degraded: " + "; ".join(problems)
                       + " -- see https://lucky2049.com/status.json")
          print(f"healthy sources: {healthy}/{len(srcs)}; no hold")
          EOF
