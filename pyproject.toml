# Tooling config only (pytest + coverage). Runtime is stdlib-only (no
# requirements.txt); this file does not define a build/package.

[tool.pytest.ini_options]
testpaths = ["tests"]
# Quiet by default; -ra shows a summary of skips/xfails. Coverage is opt-in
# (see `make cov`) so the red-green watch loop stays fast.
addopts = "-q -ra"

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    ".venv/*",
    "*/site-packages/*",
    "lucky.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
